name: iOS unsigned IPA

# Builds an UNSIGNED .ipa on GitHub's macOS runner. Sign + install it on your
# iPhone from Windows with Sideloadly (free Apple ID, 7-day validity).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ios:
    # Expo SDK 57 / RN 0.86 need Xcode 26.4+; macos-26 ships Xcode 26.6 by default.
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: moonboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moonboard/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project (prebuild + pod install)
        run: |
          npx expo prebuild --platform ios --no-install --clean
          cd ios && pod install

      - name: Xcode info
        run: |
          xcodebuild -version
          for x in /Applications/Xcode*.app; do echo "::notice::available $x"; done

      - name: Build Release .app without code signing
        shell: bash
        run: |
          set +e
          xcodebuild \
            -workspace ios/Moonlight.xcworkspace \
            -scheme Moonlight \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            > xcodebuild.log 2>&1
          status=$?
          grep -E "BUILD (SUCCEEDED|FAILED)" xcodebuild.log || true
          if [ "$status" != "0" ]; then
            echo "::group::xcodebuild errors"
            grep -E "error:|fatal error|xcodebuild: error" xcodebuild.log | head -n 40
            echo "::endgroup::"
            grep -E -A6 "error:|fatal error|xcodebuild: error" xcodebuild.log | grep -v "^--$" | head -n 24 | cut -c1-900 | sed 's/^/::error::/'
            echo "----- last 60 lines -----"
            tail -n 60 xcodebuild.log
            exit "$status"
          fi
          test -d build/Build/Products/Release-iphoneos/Moonlight.app

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: moonboard/xcodebuild.log
          retention-days: 7

      - name: Package .ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Moonlight.app Payload/
          zip -qry Moonlight-unsigned.ipa Payload
          ls -la Moonlight-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-unsigned-ipa
          path: moonboard/Moonlight-unsigned.ipa
          retention-days: 14
