name: iOS unsigned IPA

# Builds an UNSIGNED .ipa on GitHub's macOS runner. Sign + install it on your
# iPhone from Windows with Sideloadly (free Apple ID, 7-day validity).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: moonboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moonboard/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project (prebuild + pod install)
        run: npx expo prebuild --platform ios --no-install --clean && (cd ios && pod install)

      - name: Build Release .app without code signing
        run: |
          xcodebuild \
            -workspace ios/Moonlight.xcworkspace \
            -scheme Moonlight \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | xcbeautify --quiet || true
          test -d build/Build/Products/Release-iphoneos/Moonlight.app

      - name: Package .ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Moonlight.app Payload/
          zip -qry Moonlight-unsigned.ipa Payload
          ls -la Moonlight-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-unsigned-ipa
          path: moonboard/Moonlight-unsigned.ipa
          retention-days: 14
